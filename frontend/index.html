<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icons are generated by scripts/render-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Climate IoT" />
    <!-- Screen mode before first paint, so dark mode never flashes light.
         Same storage key and colours as src/lib/theme.ts. -->
    <script>
      (function () {
        var pref = null;
        try { pref = localStorage.getItem("climate-iot:theme"); } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (pref === "light" || pref === "dark") {
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = dark ? "#121315" : "#f9f9f7";
          });
        }
      })();
    </script>
    <title>Climate IoT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
