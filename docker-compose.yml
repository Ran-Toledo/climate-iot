services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${API_HOST_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

  device-simulator:
    build: ./device-simulator
    # Not started by a plain `docker compose up` -- opt in with
    # `docker compose --profile simulator up -d` (or `COMPOSE_PROFILES=simulator`
    # in .env) when you actually want a simulated device registering itself.
    profiles:
      - simulator
    environment:
      API_BASE_URL: ${API_BASE_URL}
      DEVICE_HARDWARE_ID: ${DEVICE_HARDWARE_ID}
      DEVICE_NAME: ${DEVICE_NAME}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS}
      COMMAND_POLL_INTERVAL_SECONDS: ${COMMAND_POLL_INTERVAL_SECONDS}
      AMBIENT_TEMPERATURE: ${AMBIENT_TEMPERATURE}
      STARTING_TEMPERATURE: ${STARTING_TEMPERATURE}
      TEMPERATURE_STEP: ${TEMPERATURE_STEP}
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
      args:
        # A browser-reachable URL, not the Docker-network hostname the
        # device-simulator uses -- the frontend runs in the user's browser,
        # outside the compose network. Baked in at build time (see the
        # Dockerfile), so changing API_HOST_PORT requires
        # `docker compose up --build -d frontend`, not just a restart.
        VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-8000}
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-4173}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:${FRONTEND_PORT:-4173}"
    depends_on:
      - api

volumes:
  db_data:
