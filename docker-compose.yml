services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port: only the api can reach Postgres, over the internal
    # `data` network. For psql, use `docker compose exec db psql -U <user> <db>`.
    networks:
      - data
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    # Published on every interface, so the ESP32 can reach it over Wi-Fi and
    # other devices over the LAN or Tailscale. The frontend proxies to it
    # over the `app` network.
    ports:
      - "${API_HOST_PORT:-8000}:${APP_PORT:-8000}"
    networks:
      - app
      - data
    depends_on:
      db:
        condition: service_healthy

  device-simulator:
    build: ./device-simulator
    # Not started by a plain `docker compose up` -- opt in with
    # `docker compose --profile simulator up -d` (or `COMPOSE_PROFILES=simulator`
    # in .env) when you actually want a simulated device registering itself.
    profiles:
      - simulator
    environment:
      API_BASE_URL: ${API_BASE_URL}
      DEVICE_HARDWARE_ID: ${DEVICE_HARDWARE_ID}
      DEVICE_NAME: ${DEVICE_NAME}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS}
      COMMAND_POLL_INTERVAL_SECONDS: ${COMMAND_POLL_INTERVAL_SECONDS}
      AMBIENT_TEMPERATURE: ${AMBIENT_TEMPERATURE}
      STARTING_TEMPERATURE: ${STARTING_TEMPERATURE}
      TEMPERATURE_STEP: ${TEMPERATURE_STEP}
    networks:
      - app
    depends_on:
      - api

  frontend:
    build: ./frontend
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-4173}
      # Where the frontend's server forwards /api, /docs etc. (see
      # frontend/vite.config.ts). The browser only ever talks to the frontend.
      API_PROXY_TARGET: http://api:${APP_PORT:-8000}
    # Published on 127.0.0.1 only, so it isn't reachable over Wi-Fi/LAN or a
    # plain-HTTP tailnet IP. Other devices use `tailscale serve`'s HTTPS
    # address, which proxies to this localhost port (see README).
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:${FRONTEND_PORT:-4173}"
    networks:
      - app
    depends_on:
      - api

networks:
  # The api, frontend and simulator. Not internal, so they can publish ports.
  app:
  # The api and Postgres only. `internal` means no route in or out of
  # Docker, and the frontend isn't attached to it at all.
  data:
    internal: true

volumes:
  db_data:
