; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain `pio run` builds/uploads only the real firmware, not the test envs.
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    crankyoldgit/IRremoteESP8266@^2.9.0
    bblanchon/ArduinoJson@^7.4.3

; Backend-address fallback tests (BackendResolver). Flash with
; `pio run -e <env> -t upload -t monitor`, then reflash the default env.
; mDNS lookup fails -> uses the address saved in NVS.
[env:test-wrong-host]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    '-DBACKEND_HOSTNAME_OVERRIDE="no-such-host-climateiot"'

; mDNS lookup fails and NVS is erased at boot -> uses BACKEND_BASE_URL.
[env:test-wrong-host-no-nvs]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:test-wrong-host.build_flags}
    -DBACKEND_RESOLVER_TEST_ERASE_NVS
